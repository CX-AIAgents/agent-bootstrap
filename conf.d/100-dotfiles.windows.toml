# PowerShell's $PROFILE path varies by installation method and Documents folder redirection.
# Stage $PROFILE to a fixed path '.config/mise-bootstrap/Microsoft.PowerShell_profile.ps1' before applying dotfiles, then copy it back afterwards.
[bootstrap.hooks.pre-dotfiles]
description = "Seed missing local dotfile templates and stage PowerShell $PROFILE before applying dotfiles"
run = [
  "mise run --skip-tools seed-winget-settings",
  "mise run --skip-tools stage-pwsh-profile",
]

[bootstrap.hooks.post-dotfiles]
description = "Copy staged PowerShell profile back to $PROFILE"
run = "mise run --skip-tools restore-pwsh-profile"

[tasks.seed-winget-settings]
description = "Copy winget-settings.json.template to winget-settings.json if missing"
hide = true
dir = "{{mise_config_dir}}" # Global config's default task dir ({{config_root}}) is $HOME, not the mise config directory.
shell = "pwsh -NoLogo -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$template = Join-Path (Get-Location) 'conf.d/dotfiles/winget-settings.json.template'
$target = Join-Path (Get-Location) 'conf.d/dotfiles/winget-settings.json'
if (-not (Test-Path -LiteralPath $target)) {
  Copy-Item -LiteralPath $template -Destination $target
}
'''

[tasks.stage-pwsh-profile]
description = "Stage PowerShell $PROFILE to fixed path before applying dotfiles"
hide = true
shell = "pwsh -NoLogo -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$staged = Join-Path $HOME '.config/mise-bootstrap/Microsoft.PowerShell_profile.ps1'
if (Test-Path -LiteralPath $PROFILE) {
  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $staged) | Out-Null
  Copy-Item -LiteralPath $PROFILE -Destination $staged -Force
} elseif (Test-Path -LiteralPath $staged) {
  Remove-Item -LiteralPath $staged -Force
}
'''

[tasks.restore-pwsh-profile]
description = "Copy staged PowerShell profile back to $PROFILE"
hide = true
shell = "pwsh -NoLogo -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$staged = Join-Path $HOME '.config/mise-bootstrap/Microsoft.PowerShell_profile.ps1'
if (Test-Path -LiteralPath $staged) {
  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $PROFILE) | Out-Null
  Copy-Item -LiteralPath $staged -Destination $PROFILE -Force
}
'''

[dotfiles]
"~/.config/mise-bootstrap/Microsoft.PowerShell_profile.ps1/mise-activate" = { source = "dotfiles/terminal/pwsh-mise.ps1", template = "tera" }
"~/.config/mise-bootstrap/Microsoft.PowerShell_profile.ps1/starship" = { source = "dotfiles/terminal/pwsh-starship.ps1", template = "tera" }
"~/.pi/agent/settings.json/shell-path" = { source = "dotfiles/ai-agent-config/pi-settings.windows.json", template = "tera", merge = true }
"~/.codex/config.toml/windows" = { source = "dotfiles/ai-agent-config/codex-config.windows.toml", merge = true }
# "~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/settings.json/winget-settings" = { source = "dotfiles/winget-settings.json", merge = true, format = "jsonc" } # disabled for now, I think winget should be simiar situation to scoop, where it should be already preconfigured correctly before running mise bootstrap
