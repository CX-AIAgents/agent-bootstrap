# Select Windows/Linux variants automatically, including conf.d/ fragments.
auto_env = true # Enable Windows/Linux variants detection, automatically set -E windows or -E linux
env_conf_d = true # A conf.d/xxx.windows.toml or conf.d/xxx.linux.toml will be automatically picked up by the correct variant

[env_sets]
desktop = ["desktop", "{{ os() }}-desktop"]
